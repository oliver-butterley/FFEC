name = "FFEC"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FFEC"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # not a Mathlib-bound project; no per-file copyright headers
maxSynthPendingDepth = 3

# Pratt/Pocklington primality certificates (`prime_cert%` / `pock%`); discharges `p_prime`.
# Listed before mathlib so Mathlib's transitive-dep versions take precedence (lake resolution).
[[require]]
name = "PrimeCert"
git = "https://github.com/b-mehta/PrimeCert.git"
# rev = "15fd61770c9a893af0f5cb7893ea98b7d0bf8d52"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# rev = "v4.30.0"

[[lean_lib]]
name = "FFEC"
